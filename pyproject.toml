[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-ai-workflows"
version = "0.1.0"
description = "Four personal injury law-firm AI agent workflows, rebuilt on synthetic data for a portfolio."
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "python-docx>=1.1"]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "mcp>=1.9,<2"]
dev = ["pytest>=8", "pypdf>=4", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "mcp>=1.9,<2"]

[project.scripts]
legal-workflows = "legal_workflows.cli:main"
legal-cms-mcp = "legal_workflows.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legal_workflows = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
